[permissions]
filesystem_paths = [".", "../yoker"]

[context]
storage_path = "./local/context"

[agents.directories]
c3 = "../c3/agents"

[skills]
discovery = true

[skills.directories]
c3 = "../c3/skills"

[tools.make]
enabled = true

[tools.make.allowed_env_vars]
run = [ "MODEL" ]
test = ["TEST"]
lint = ["LINT_FLAGS", "LINT_CONFIG"]

[tools.git]
enabled = true
auto_permission = [
  "status", "log", "diff", "show",
  "branch", "checkout", "pull", "rebase",
  "tag",
  "commit", "add"
]

[tools.github]
allowed_operations = [
  "repo_view", "issue_list", "issue_view",
  "workflow_list", "workflow_view", "workflow_logs",
  "release_create", "release_list", "release_view",
  "pr_list", "pr_view",
  "pr_reviews", "pr_comments",
  "pr_create", "pr_comment", "pr_ready", "pr_edit"
]
